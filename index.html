<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FAWAZ AI BOT</title>

  <script src="https://unpkg.com/@solana/web3.js@1.98.4/lib/index.iife.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #fff;
      color: #111;
    }

    .card {
      max-width: 620px;
    }

    button {
      margin: 6px;
      padding: 11px 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status {
      margin-top: 14px;
      font-weight: 700;
    }

    .panel {
      margin-top: 14px;
      padding: 14px;
      background: #f3f4f6;
      border-radius: 10px;
      line-height: 1.8;
      white-space: pre-wrap;
    }

    .buy {
      color: green;
      font-weight: 700;
    }

    .sell {
      color: red;
      font-weight: 700;
    }

    .hold {
      color: #555;
      font-weight: 700;
    }
  </style>
</head>

<body>
  <div class="card">
    <h2>⚡ FAWAZ AI DEX TRADER</h2>

    <div>
      <b>المحفظة:</b>
      <span id="walletAddress">غير متصلة</span>
    </div>

    <br />

    <button id="connectButton" type="button">
      ربط محفظة OKX
    </button>

    <button id="runAgentsButton" type="button" disabled>
      تشغيل الوكلاء
    </button>

    <div class="status" id="status">
      بانتظار ربط المحفظة
    </div>

    <hr />

    <h3>قرار التداول</h3>

    <div class="panel" id="decisionPanel">
      لم يتم تشغيل الوكلاء بعد.
    </div>

    <button id="approveButton" type="button" disabled>
      موافقة وتنفيذ الصفقة
    </button>

    <div class="panel" id="executionPanel">
      لا توجد صفقة جاهزة للتنفيذ.
    </div>
  </div>

  <script>
    let connectedAddress = "";
    let pendingSwapTransaction = null;
    let pendingDecision = null;

    function getOKXProvider() {
      return window.okxwallet && window.okxwallet.solana
        ? window.okxwallet.solana
        : null;
    }

    function base64ToBytes(value) {
      const binary = atob(value);

      const bytes =
        new Uint8Array(binary.length);

      for (
        let i = 0;
        i < binary.length;
        i++
      ) {
        bytes[i] =
          binary.charCodeAt(i);
      }

      return bytes;
    }

    async function connectOKXWallet() {
      const status =
        document.getElementById("status");

      const walletLabel =
        document.getElementById(
          "walletAddress"
        );

      const provider =
        getOKXProvider();

      if (!provider) {
        status.textContent =
          "افتح الصفحة من متصفح OKX Wallet.";
        return;
      }

      try {
        status.textContent =
          "بانتظار موافقة محفظة OKX...";

        const result =
          await provider.connect();

        const publicKey =
          result && result.publicKey
            ? result.publicKey
            : provider.publicKey;

        connectedAddress =
          publicKey
            ? publicKey.toString()
            : "";

        if (!connectedAddress) {
          throw new Error(
            "لم يتم استلام عنوان المحفظة"
          );
        }

        walletLabel.textContent =
          connectedAddress.slice(0, 6) +
          "..." +
          connectedAddress.slice(-4);

        status.textContent =
          "✅ تم ربط محفظة OKX";

        document.getElementById(
          "runAgentsButton"
        ).disabled = false;

      } catch (error) {
        status.textContent =
          "❌ فشل الربط: " +
          (
            error.message ||
            "تم الإلغاء"
          );
      }
    }

    async function runAgents() {
      const status =
        document.getElementById("status");

      const decisionPanel =
        document.getElementById(
          "decisionPanel"
        );

      const executionPanel =
        document.getElementById(
          "executionPanel"
        );

      const approveButton =
        document.getElementById(
          "approveButton"
        );

      if (!connectedAddress) {
        status.textContent =
          "اربط المحفظة أولًا.";
        return;
      }

      pendingSwapTransaction = null;
      pendingDecision = null;

      approveButton.disabled = true;

      try {
        status.textContent =
          "🤖 الوكلاء يحللون السوق...";

        decisionPanel.textContent =
          "جارٍ تحليل السوق والمخاطر...";

        executionPanel.textContent =
          "بانتظار قرار الوكلاء.";

        const response =
          await fetch(
            "/api/trade-orchestrator",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                walletAddress:
                  connectedAddress
              })
            }
          );

        const data =
          await response.json();

        if (!response.ok) {
          throw new Error(
            data.message ||
            "فشل تشغيل الوكلاء"
          );
        }

        const decision =
          String(
            data.decision || ""
          ).toUpperCase();

        const market =
          data.market || {};

        const balances =
          data.balances || {};

        const reason =
          data.reason ||
          data.risk?.reason ||
          "";

        let decisionClass =
          "hold";

        if (decision === "BUY") {
          decisionClass = "buy";
        }

        if (decision === "SELL") {
          decisionClass = "sell";
        }

        decisionPanel.innerHTML =
          "القرار: <span class=\"" +
          decisionClass +
          "\">" +
          decision +
          "</span>" +
          "\nالثقة: " +
          (data.confidence ?? "-") +
          "%" +
          "\nالسعر الحالي: " +
          (market.currentPrice ?? "-") +
          "\nSMA10: " +
          (market.sma10 ?? "-") +
          "\nSMA30: " +
          (market.sma30 ?? "-") +
          "\nMomentum: " +
          (market.momentum ?? "-") +
          "%" +
          "\nVolatility: " +
          (market.volatility ?? "-") +
          "%" +
          "\nSOL: " +
          (balances.solBalance ?? "-") +
          "\nUSDC: " +
          (balances.usdcBalance ?? "-") +
          "\nالسبب: " +
          reason;

        if (
          decision === "HOLD" ||
          data.status === "blocked"
        ) {
          status.textContent =
            decision === "HOLD"
              ? "⏸️ لا توجد صفقة الآن"
              : "🛡️ وكيل المخاطر منع الصفقة";

          executionPanel.textContent =
            data.risk?.reason ||
            data.message ||
            "لا توجد صفقة جاهزة.";

          return;
        }

        const swapTransaction =
          data.execution
            ?.swapTransaction;

        if (!swapTransaction) {
          throw new Error(
            "لم تصل معاملة صالحة من Execution Agent"
          );
        }

        pendingSwapTransaction =
          swapTransaction;

        pendingDecision =
          decision;

        approveButton.disabled = false;

        executionPanel.textContent =
          "✅ صفقة " +
          decision +
          " جاهزة.\n" +
          "راجعها ثم اضغط موافقة وتنفيذ.";

        status.textContent =
          "✅ الوكلاء وافقوا على الصفقة";

      } catch (error) {
        status.textContent =
          "❌ خطأ: " +
          (
            error.message ||
            "تعذر تشغيل النظام"
          );

        decisionPanel.textContent =
          "تعذر الحصول على قرار.";

        executionPanel.textContent =
          "لم يتم تنفيذ أي شيء.";
      }
    }

    async function approveAndExecute() {
      const status =
        document.getElementById("status");

      const executionPanel =
        document.getElementById(
          "executionPanel"
        );

      const provider =
        getOKXProvider();

      if (
        !provider ||
        !pendingSwapTransaction
      ) {
        status.textContent =
          "لا توجد صفقة جاهزة.";
        return;
      }

      try {
        status.textContent =
          "📲 ستظهر موافقة OKX الآن...";

        const transaction =
          solanaWeb3.VersionedTransaction
            .deserialize(
              base64ToBytes(
                pendingSwapTransaction
              )
            );

        const signedTransaction =
          await provider.signTransaction(
            transaction
          );

        status.textContent =
          "تم التوقيع. جارٍ إرسال المعاملة إلى شبكة Solana...";

        const connection =
          new solanaWeb3.Connection(
            "https://api.mainnet-beta.solana.com",
            "confirmed"
          );

        const signature =
          await connection.sendRawTransaction(
            signedTransaction.serialize(),
            {
              skipPreflight: false,
              maxRetries: 3
            }
          );

        executionPanel.textContent =
          "جارٍ تأكيد المعاملة...\n" +
          "Signature:\n" +
          signature;

        await connection.confirmTransaction(
          signature,
          "confirmed"
        );

        status.textContent =
          "✅ تم تنفيذ الصفقة بنجاح";

        executionPanel.textContent =
          "✅ تم تنفيذ " +
          pendingDecision +
          " بنجاح.\n\n" +
          "Signature:\n" +
          signature;

        pendingSwapTransaction = null;
        pendingDecision = null;

        document.getElementById(
          "approveButton"
        ).disabled = true;

      } catch (error) {
        status.textContent =
          "❌ لم تكتمل الصفقة: " +
          (
            error.message ||
            "تم الإلغاء أو فشل التنفيذ"
          );
      }
    }

    document.getElementById(
      "connectButton"
    ).addEventListener(
      "click",
      connectOKXWallet
    );

    document.getElementById(
      "runAgentsButton"
    ).addEventListener(
      "click",
      runAgents
    );

    document.getElementById(
      "approveButton"
    ).addEventListener(
      "click",
      approveAndExecute
    );
  </script>
</body>
</html>
