<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FAWAZ AI TRADER</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:18px;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#0c0f14;
  color:#fff;
}

.container{
  max-width:680px;
  margin:auto;
}

.header{
  padding:20px;
  margin-bottom:14px;
  background:#151a22;
  border:1px solid #232a35;
  border-radius:22px;
}

h1{
  margin:0;
  font-size:25px;
  font-weight:900;
}

.sub{
  margin-top:8px;
  color:#8e98a7;
  font-size:13px;
}

.status{
  margin-top:14px;
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:8px 12px;
  border-radius:999px;
  background:#10251a;
  color:#3ee58a;
  font-weight:800;
  font-size:13px;
}

.dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#3ee58a;
}

.hero{
  background:linear-gradient(145deg,#171d26,#11161d);
  border:1px solid #252d39;
  padding:24px;
  border-radius:24px;
  margin-bottom:14px;
}

.label{
  color:#8d97a5;
  font-size:13px;
  margin-bottom:8px;
}

.big{
  font-size:36px;
  font-weight:950;
  letter-spacing:-1px;
  direction:ltr;
  text-align:right;
}

.pnl{
  margin-top:8px;
  font-size:18px;
  font-weight:900;
  direction:ltr;
  text-align:right;
}

.positive{
  color:#32d583;
}

.negative{
  color:#f04438;
}

.neutral{
  color:#9aa4b2;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.card{
  background:#151a22;
  border:1px solid #232a35;
  border-radius:20px;
  padding:18px;
}

.value{
  font-size:25px;
  font-weight:900;
  margin-top:6px;
  direction:ltr;
  text-align:right;
}

.footer{
  margin-top:14px;
  text-align:center;
  color:#717b89;
  font-size:12px;
}

.error{
  color:#f97066;
}

@media(max-width:480px){
  .big{
    font-size:31px;
  }

  .value{
    font-size:21px;
  }

  h1{
    font-size:22px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>⚡ FAWAZ AI TRADER</h1>

    <div class="sub">
      SOL / USDC · FULL AUTO
    </div>

    <div class="status">
      <span class="dot"></span>
      <span id="systemStatus">
        جاري الاتصال...
      </span>
    </div>
  </div>


  <div class="hero">

    <div class="label">
      القيمة الحقيقية للمحفظة
    </div>

    <div
      id="capitalTotal"
      class="big"
    >
      -
    </div>

    <div
      id="totalPnl"
      class="pnl neutral"
    >
      الربح المسجل: -
    </div>

  </div>


  <div class="grid">

    <div class="card">
      <div class="label">
        USDC الحقيقي
      </div>

      <div
        id="usdcBalance"
        class="value"
      >
        -
      </div>
    </div>


    <div class="card">
      <div class="label">
        SOL الحقيقي
      </div>

      <div
        id="solBalance"
        class="value"
      >
        -
      </div>
    </div>


    <div class="card">
      <div class="label">
        الصفقات المفتوحة الآن
      </div>

      <div
        id="openTrades"
        class="value"
      >
        -
      </div>
    </div>


    <div class="card">
      <div class="label">
        إجمالي الصفقات
      </div>

      <div
        id="totalTrades"
        class="value"
      >
        -
      </div>
    </div>


    <div class="card">
      <div class="label">
        الصفقات الرابحة
      </div>

      <div
        id="wins"
        class="value positive"
      >
        -
      </div>
    </div>


    <div class="card">
      <div class="label">
        الصفقات الخاسرة
      </div>

      <div
        id="losses"
        class="value negative"
      >
        -
      </div>
    </div>


    <div class="card">
      <div class="label">
        نسبة النجاح
      </div>

      <div
        id="winRate"
        class="value"
      >
        -
      </div>
    </div>


    <div class="card">
      <div class="label">
        المتاح للتداول
      </div>

      <div
        id="available"
        class="value"
      >
        -
      </div>
    </div>

  </div>


  <div class="footer">
    آخر تحديث:
    <span id="lastUpdate">-</span>
  </div>

</div>


<script>

function number(
  value,
  fallback = 0
){
  const n = Number(value);

  return Number.isFinite(n)
    ? n
    : fallback;
}


function usdc(
  value,
  decimals = 4
){
  return (
    number(value)
      .toFixed(decimals) +
    " USDC"
  );
}


function sol(
  value,
  decimals = 6
){
  return (
    number(value)
      .toFixed(decimals) +
    " SOL"
  );
}


function setPnl(
  value
){
  const pnl =
    number(value);

  const el =
    document.getElementById(
      "totalPnl"
    );

  el.textContent =
    "الربح المسجل: " +
    (
      pnl >= 0
        ? "+"
        : ""
    ) +
    pnl.toFixed(6) +
    " USDC";

  el.className =
    "pnl " +
    (
      pnl > 0
        ? "positive"
        : pnl < 0
        ? "negative"
        : "neutral"
    );
}


async function getJson(
  url
){
  const response =
    await fetch(
      url,
      {
        method:"GET",
        headers:{
          Accept:
            "application/json"
        },
        cache:"no-store"
      }
    );

  const data =
    await response.json();

  if(!response.ok){
    throw new Error(
      data.message ||
      "API ERROR"
    );
  }

  return data;
}


async function refresh(){

  const status =
    document.getElementById(
      "systemStatus"
    );

  try{

    const [
      bot,
      wallet
    ] =
      await Promise.all([

        getJson(
          "/api/trade-orchestrator"
        ),

        getJson(
          "/api/execution-agent?test=wallet"
        )

      ]);


    const dashboard =
      bot.dashboard || {};

    const all =
      dashboard.allTime || {};

    const positions =
      Array.isArray(
        dashboard.openPositions
      )
        ? dashboard.openPositions
        : [];


    const solBalance =
      number(
        wallet.solBalance,
        0
      );


    const usdcBalance =
      number(
        wallet.usdcBalance,
        0
      );


    const currentPrice =
      number(
        bot.signal?.currentPrice,
        0
      );


    const realWalletValue =
      usdcBalance +
      (
        solBalance *
        currentPrice
      );


    if(
      bot.realTrading === true &&
      bot.execution === "FULL_AUTO" &&
      wallet.tradingKeyReady === true
    ){
      status.textContent =
        "البوت يعمل فعليًا";
      status.className = "";
    }
    else{
      status.textContent =
        "تحقق من حالة البوت";
      status.className =
        "error";
    }


    document.getElementById(
      "capitalTotal"
    ).textContent =
      realWalletValue
        .toFixed(4) +
      " USDC";


    document.getElementById(
      "usdcBalance"
    ).textContent =
      usdc(
        usdcBalance,
        4
      );


    document.getElementById(
      "solBalance"
    ).textContent =
      sol(
        solBalance,
        6
      );


    setPnl(
      all.pnl
    );


    document.getElementById(
      "openTrades"
    ).textContent =
      positions.length;


    document.getElementById(
      "totalTrades"
    ).textContent =
      number(
        all.trades
      );


    document.getElementById(
      "wins"
    ).textContent =
      number(
        all.wins
      );


    document.getElementById(
      "losses"
    ).textContent =
      number(
        all.losses
      );


    document.getElementById(
      "winRate"
    ).textContent =
      number(
        all.winRate
      ).toFixed(1) +
      "%";


    document.getElementById(
      "available"
    ).textContent =
      usdc(
        usdcBalance,
        4
      );


    document.getElementById(
      "lastUpdate"
    ).textContent =
      new Date()
        .toLocaleTimeString(
          "ar-SA"
        );

  }
  catch(error){

    console.error(
      error
    );

    status.textContent =
      "تعذر الاتصال بالبوت";

    status.className =
      "error";
  }
}


refresh();

setInterval(
  refresh,
  10000
);

</script>

</body>
</html>
