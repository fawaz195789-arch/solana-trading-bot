<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FAWAZ AI BOT</title>

  <script src="https://plugin.jup.ag/plugin-v1.js" data-preload defer></script>

  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #fff; color: #111; }
    .card { max-width: 520px; }
    button { margin-left: 8px; padding: 8px 12px; cursor: pointer; }
    .status { margin-top: 14px; font-weight: 700; }
    #jupiter-plugin { height: 620px; margin-top: 18px; }
  </style>
</head>

<body>
  <div class="card">
    <h3>⚡ على سولانا DEX تداول</h3>

    <div>
      <b>المحفظة:</b>
      <span id="walletAddress">غير متصلة</span>
    </div>

    <br />

    <button id="connectButton" type="button">ربط محفظة OKX</button>
    <button id="testButton" type="button" disabled>اختبار الاتصال</button>

    <div class="status" id="dexStatus">بانتظار ربط المحفظة</div>

    <hr />

    <h3>اختبار صفقة حقيقية محدود</h3>
    <p>0.01 SOL إلى USDC فقط — راجع التفاصيل داخل Jupiter قبل الموافقة.</p>

    <div id="jupiter-plugin"></div>
  </div>

  <script>
    let connectedAddress = "";

    function getOKXProvider() {
      return window.okxwallet && window.okxwallet.solana
        ? window.okxwallet.solana
        : null;
    }

    async function connectOKXWallet() {
      const status = document.getElementById("dexStatus");
      const wallet = document.getElementById("walletAddress");
      const testButton = document.getElementById("testButton");
      const provider = getOKXProvider();

      if (!provider) {
        status.textContent = "افتح الصفحة من متصفح OKX Wallet.";
        return;
      }

      try {
        status.textContent = "بانتظار موافقة محفظة OKX...";
        const result = await provider.connect();
        const publicKey = result && result.publicKey
          ? result.publicKey
          : provider.publicKey;

        connectedAddress = publicKey ? publicKey.toString() : "";

        if (!connectedAddress) {
          throw new Error("لم يتم استلام عنوان المحفظة");
        }

        wallet.textContent =
          connectedAddress.slice(0, 6) + "..." + connectedAddress.slice(-4);

        status.textContent = "✅ تم ربط محفظة OKX بنجاح";
        testButton.disabled = false;
      } catch (error) {
        status.textContent = "❌ لم يكتمل الربط: " + (error.message || "تم الإلغاء");
      }
    }

    function testConnection() {
      document.getElementById("dexStatus").textContent =
        connectedAddress
          ? "✅ الاتصال سليم، ولم تُنفذ أي صفقة أو عملية سحب."
          : "اربط المحفظة أولًا.";
    }

    document.getElementById("connectButton")
      .addEventListener("click", connectOKXWallet);

    document.getElementById("testButton")
      .addEventListener("click", testConnection);

    window.addEventListener("load", function () {
      window.Jupiter.init({
        displayMode: "integrated",
        integratedTargetId: "jupiter-plugin",
        formProps: {
          initialInputMint: "So11111111111111111111111111111111111111112",
          initialOutputMint: "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v",
          initialAmount: "0.01",
          fixedMint: "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v",
          fixedAmount: true,
          swapMode: "ExactIn"
        },
        onSuccess: function ({ txid }) {
          document.getElementById("dexStatus").textContent =
            "✅ تمت الصفقة بنجاح: " + txid;
        },
        onSwapError: function () {
          document.getElementById("dexStatus").textContent =
            "❌ لم تُنفذ الصفقة أو تم إلغاؤها.";
        }
      });
    });
  </script>
</body>
</html>
