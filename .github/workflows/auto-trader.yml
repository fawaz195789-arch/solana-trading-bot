name: SOL Auto Trader

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sol-auto-trader
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest

    steps:
      - name: Run full auto trading cycle
        env:
          AUTO_TRADER_SECRET: ${{ secrets.AUTO_TRADER_SECRET }}

        run: |
          set -euo pipefail

          BASE_URL="https://fawaz-ai-bot.vercel.app"

          echo "Starting FAWAZ FULL AUTO trading cycle..."

          RESPONSE=$(curl \
            --silent \
            --show-error \
            --fail-with-body \
            --connect-timeout 15 \
            --max-time 50 \
            --retry 2 \
            --request POST \
            -H "Authorization: Bearer ${AUTO_TRADER_SECRET}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            --data '{}' \
            "$BASE_URL/api/trade-orchestrator")

          echo "$RESPONSE" | jq .

          ENGINE=$(echo "$RESPONSE" | jq -r '.engine // ""')
          STATUS=$(echo "$RESPONSE" | jq -r '.status // "error"')
          EXECUTION=$(echo "$RESPONSE" | jq -r '.execution // ""')
          EXECUTED=$(echo "$RESPONSE" | jq -r '.executed // false')

          if [ "$ENGINE" != "FAWAZ_AUTO_TRADER_V2" ]; then
            echo "Wrong engine: $ENGINE"
            exit 1
          fi

          if [ "$EXECUTION" != "FULL_AUTO" ]; then
            echo "Wrong execution mode: $EXECUTION"
            exit 1
          fi

          echo "Engine: $ENGINE"
          echo "Status: $STATUS"
          echo "Execution mode: $EXECUTION"
          echo "Executed: $EXECUTED"

          if [ "$STATUS" = "error" ]; then
            echo "Trading cycle returned an error."
            exit 1
          fi

          if [ "$EXECUTED" = "true" ]; then

            SIDE=$(echo "$RESPONSE" | jq -r '.result.side // "-"')
            SLOT=$(echo "$RESPONSE" | jq -r '.result.slotId // "-"')
            SIGNATURE=$(echo "$RESPONSE" | jq -r '.result.signature // "-"')

            echo "================================="
            echo "REAL TRADE EXECUTED"
            echo "Side: $SIDE"
            echo "Slot: $SLOT"
            echo "Signature: $SIGNATURE"
            echo "================================="

          else

            ACTION=$(echo "$RESPONSE" | jq -r '.signal.action // "-"')
            REASON=$(echo "$RESPONSE" | jq -r '.reason // "-"')

            echo "No trade executed this cycle."
            echo "Signal: $ACTION"
            echo "Reason: $REASON"
          fi
