name: SOL Auto Trader

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sol-auto-trader
  cancel-in-progress: false

jobs:
  run-trader:
    runs-on: ubuntu-latest

    steps:
      - name: Run automatic trading cycle
        env:
          AUTO_TRADER_SECRET: ${{ secrets.AUTO_TRADER_SECRET }}

        run: |
          curl --silent --show-error --fail-with-body \
            --connect-timeout 15 \
            --max-time 50 \
            --retry 2 \
            -X POST \
            -H "Authorization: Bearer ${AUTO_TRADER_SECRET}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            --data '{
              "walletAddress":"3jDHDWej98HoeAD3aYcahy1BuShKfREssnMGLYpHGski"
            }' \
            "https://fawaz-ai-bot.vercel.app/api/trade-orchestrator"
