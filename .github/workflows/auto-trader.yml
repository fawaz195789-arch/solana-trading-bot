name: SOL Auto Trader

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sol-auto-trader
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest

    # يمنع أي Job عالق لفترة طويلة
    timeout-minutes: 6

    steps:
      - name: Run fast trading cycles
        env:
          AUTO_TRADER_SECRET: ${{ secrets.AUTO_TRADER_SECRET }}

        run: |
          set -euo pipefail

          BASE_URL="https://fawaz-ai-bot.vercel.app"
          ENDPOINT="$BASE_URL/api/trade-orchestrator"

          echo "======================================"
          echo "FAWAZ AI TRADER - FAST POST ENGINE"
          echo "======================================"

          # 14 دورة × 20 ثانية
          # تقريباً 4 دقائق و40 ثانية
          # ثم GitHub يبدأ التشغيل المجدول التالي
          TOTAL_CYCLES=14
          DELAY_SECONDS=20

          for i in $(seq 1 $TOTAL_CYCLES); do

            echo ""
            echo "======================================"
            echo "Trading cycle $i / $TOTAL_CYCLES"
            echo "======================================"

            RESPONSE=$(curl \
              --silent \
              --show-error \
              --fail-with-body \
              --connect-timeout 15 \
              --max-time 50 \
              --retry 2 \
              --retry-delay 2 \
              -X POST \
              -H "Authorization: Bearer ${AUTO_TRADER_SECRET}" \
              -H "Content-Type: application/json" \
              -H "Accept: application/json" \
              "$ENDPOINT" \
              || true)

            echo "$RESPONSE"

            # نعرض أهم نتيجة بشكل واضح إذا jq متوفر
            if echo "$RESPONSE" | jq . >/dev/null 2>&1; then

              STATUS=$(echo "$RESPONSE" | jq -r '.status // "-"')
              EXECUTED=$(echo "$RESPONSE" | jq -r '.executed // false')
              SIDE=$(echo "$RESPONSE" | jq -r '.result.side // "-"')
              REASON=$(echo "$RESPONSE" | jq -r '.result.reason // .reason // "-"')
              ENGINE=$(echo "$RESPONSE" | jq -r '.engine // "-"')

              echo ""
              echo "Engine:   $ENGINE"
              echo "Status:   $STATUS"
              echo "Executed: $EXECUTED"
              echo "Side:     $SIDE"
              echo "Reason:   $REASON"

            else

              echo "Warning: API returned non-JSON response."

            fi

            # آخر دورة لا تحتاج انتظار
            if [ "$i" -lt "$TOTAL_CYCLES" ]; then
              echo ""
              echo "Waiting ${DELAY_SECONDS}s..."
              sleep "$DELAY_SECONDS"
            fi

          done

          echo ""
          echo "======================================"
          echo "FAST TRADING SESSION FINISHED"
          echo "======================================"
